upstream app {
  server app:8080;
  keepalive 64;
}

server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  # 静的ファイルの配信を高速化
  sendfile on;
  tcp_nopush on;
  open_file_cache max=1000 inactive=20s;

  gzip on;
  gzip_types text/css application/javascript application/json text/html;
  gzip_min_length 1024;

  # 画像はファイルが存在すれば nginx が直接配信し、無ければ app にフォールバック
  location /image/ {
    expires 1d;
    add_header Cache-Control "public";
    try_files $uri @app;
  }

  # CSS / JS / favicon などの静的アセットを nginx が直接配信
  location ~ ^/(css|js|img|favicon\.ico) {
    expires 1d;
    add_header Cache-Control "public";
    try_files $uri @app;
  }

  location / {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }

  location @app {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }
}
